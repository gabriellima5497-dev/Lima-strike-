<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lima Strike</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(0, 255, 0, 0.85);
    }
    #crosshair::before { top: 4px; left: -8px; width: 26px; height: 2px; }
    #crosshair::after { top: -8px; left: 4px; width: 2px; height: 26px; }
    
    /* HUD de Toque para Celular */
    .hud-btn {
      position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4); color: white; display: flex;
      align-items: center; justify-content: center; font-weight: bold;
    }
    #btn-fire { right: 40px; bottom: 40px; width: 70px; height: 70px; background: rgba(255, 0, 0, 0.4); }
    #btn-crouch { right: 125px; bottom: 35px; width: 50px; height: 50px; }
    #btn-reload { right: 40px; bottom: 125px; width: 50px; height: 50px; }
    #hud-info {
      position: absolute; top: 15px; left: 20px; color: #fff; font-size: 14px;
      text-shadow: 1px 1px 2px #000;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="hud-info">
    <div><strong>LIMA STRIKE</strong></div>
    <div id="ammo-display">MUNIÇÃO: 30 / 90</div>
    <div id="health-display">HP: 100</div>
  </div>

  <button id="btn-fire" class="hud-btn">FIRE</button>
  <button id="btn-reload" class="hud-btn">R</button>
  <button id="btn-crouch" class="hud-btn">C</button>

  <script>
    // Configuração Three.js com Sombras
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Céu
    scene.fog = new THREE.Fog(0x87ceeb, 20, 90);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.7, 5); // Altura padrão do jogador em pé

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Iluminação
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 25, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // Chão do Mapa
    const floorGeo = new THREE.PlaneGeometry(100, 100);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Caixas de Cobertura (Obstáculos estilo CS)
    const boxGeo = new THREE.BoxGeometry(2, 2, 2);
    const boxMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
    
    for(let i = -3; i <= 3; i += 2) {
      const box = new THREE.Mesh(boxGeo, boxMat);
      box.position.set(i * 4, 1, -10 + i * 2);
      box.castShadow = true;
      box.receiveShadow = true;
      scene.add(box);
    }

    // Modelo provisório da Arma
    const gunGroup = new THREE.Group();
    const gunBody = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.15, 0.6),
      new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.3 })
    );
    gunBody.castShadow = true;
    gunGroup.add(gunBody);
    gunGroup.position.set(0.3, -0.3, -0.6);
    camera.add(gunGroup);
    scene.add(camera);

    // Estado do Jogo
    let ammo = 30;
    let isCrouched = false;

    // Disparo com recuo visual
    function shoot() {
      if (ammo <= 0) return;
      ammo--;
      document.getElementById('ammo-display').innerText = `MUNIÇÃO: ${ammo} / 90`;
      
      // Animação simples de recuo
      gunGroup.position.z += 0.08;
      setTimeout(() => gunGroup.position.z -= 0.08, 60);
    }

    // Agachar
    function toggleCrouch() {
      isCrouched = !isCrouched;
      camera.position.y = isCrouched ? 0.9 : 1.7;
    }

    // Recarregar
    function reload() {
      ammo = 30;
      document.getElementById('ammo-display').innerText = `MUNIÇÃO: ${ammo} / 90`;
    }

    // Eventos de Toque dos Botões
    document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
    document.getElementById('btn-crouch').addEventListener('touchstart', (e) => { e.preventDefault(); toggleCrouch(); });
    document.getElementById('btn-reload').addEventListener('touchstart', (e) => { e.preventDefault(); reload(); });

    // Loop de renderização
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
